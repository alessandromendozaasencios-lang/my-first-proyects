<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sigues aquí</title>
<style>
  :root{
    --sky-top:#171c38;
    --sky-mid:#3d4a7a;
    --sky-low:#e8a87c;
    --cloud:#d7dcef;
    --cloud-shade:#aab2d1;
    --bench:#6b4a35;
    --bench-shade:#4a3024;
    --char:#3a6a7a;
    --char-shade:#274c58;
    --moon:#f5e6c8;
    --moon-shade:#d8c49a;
    --paper:#faf6ef;
    --ink:#332f2a;
    --muted:#8a8278;
    --card-border:#e6ddcf;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Georgia','Times New Roman',serif;
    background:var(--paper);
    color:var(--ink);
    overflow-x:hidden;
    min-height:100vh;
  }
  main{
    max-width:560px;
    margin:0 auto;
    padding:28px 18px 60px;
  }

  /* ---------- Sky scene ---------- */
  .sky-scene{
    position:relative;
    width:100%;
    aspect-ratio: 3 / 4;
    border-radius:22px;
    overflow:hidden;
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-low) 100%);
    box-shadow:0 18px 40px rgba(23,28,56,0.25);
  }
  .star{
    position:absolute;
    width:3px; height:3px;
    background:rgba(255,255,255,0.85);
    border-radius:1px;
    z-index:1;
  }
  .moon{
    position:absolute;
    top:7%; right:10%;
    width:13%; aspect-ratio:1/1;
    background:var(--moon);
    border-radius:50%;
    box-shadow: inset -6px -6px 0 var(--moon-shade);
    z-index:1;
  }
  .cloud{
    position:absolute;
    background:var(--cloud);
    border-radius:40%;
    box-shadow: inset -4px -5px 0 var(--cloud-shade);
    z-index:1;
  }
  @media (prefers-reduced-motion: no-preference){
    .cloud{ animation:drift linear infinite; }
  }
  @keyframes drift{
    from{ transform:translateX(-14px); }
    to{ transform:translateX(14px); }
  }

  .day-count{
    position:absolute;
    top:14%;
    left:0; right:0;
    text-align:center;
    z-index:3;
  }
  .day-number{
    display:block;
    font-size:clamp(3rem,16vw,4.2rem);
    font-weight:bold;
    color:#fffaf2;
    text-shadow:0 0 18px rgba(255,250,242,0.45);
    font-variant-numeric:tabular-nums;
    line-height:1;
  }
  .day-label{
    display:block;
    margin-top:2px;
    font-size:0.95rem;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:#f3ead9;
  }
  .day-sub{
    display:block;
    margin-top:10px;
    font-size:0.8rem;
    color:#dfe3f2;
    font-style:italic;
  }

  .bench-scene{
    position:absolute;
    bottom:6%;
    left:0; right:0;
    height:128px;
    z-index:2;
  }
  .bench-scene svg{
    position:absolute;
    left:50%;
    bottom:0;
    transform:translateX(-50%);
    shape-rendering:crispEdges;
  }

  /* ---------- Affirmation box ---------- */
  .affirmation-section{
    margin-top:28px;
    text-align:center;
  }
  .affirmation-btn{
    font-family:inherit;
    font-size:1rem;
    background:var(--char);
    color:#fff;
    border:none;
    border-radius:14px;
    padding:16px 28px;
    cursor:pointer;
    box-shadow:0 10px 24px rgba(58,106,122,0.3);
  }
  .affirmation-btn:hover{ background:var(--char-shade); }
  .affirmation-btn:active{ transform:translateY(1px); }

  .affirmation-message{
    margin:20px auto 0;
    max-width:420px;
    min-height:1.6em;
    font-size:1.08rem;
    line-height:1.6;
    font-style:italic;
    color:var(--ink);
    opacity:0;
    transition:opacity 0.4s ease;
  }
  .affirmation-message.show{ opacity:1; }

  .closing-line{
    margin-top:44px;
    text-align:center;
    font-size:0.85rem;
    color:var(--muted);
    font-style:italic;
  }

  @media (max-width:360px){
    .affirmation-btn{ padding:14px 22px; font-size:0.95rem; }
  }
</style>
</head>
<body>

<main>
  <div class="sky-scene" id="sky-scene">
    <div class="moon"></div>
    <!-- Las estrellas y nubes se generan por JS para variar su posición sin repetir código a mano. -->

    <div class="day-count">
      <span class="day-number" id="day-number">—</span>
      <span class="day-label">días</span>
      <span class="day-sub">desde el 20 de octubre. Sigues aquí.</span>
    </div>

    <div class="bench-scene">
      <svg class="character" viewBox="0 0 16 16" width="128" height="128">
        <rect x="5" y="0" width="6" height="5" fill="#4f8495"/>
        <rect x="9" y="0" width="2" height="5" fill="#274c58"/>
        <rect x="4" y="5" width="8" height="5" fill="#4f8495"/>
        <rect x="10" y="5" width="2" height="5" fill="#274c58"/>
        <rect x="2" y="8" width="2" height="3" fill="#4f8495"/>
        <rect x="12" y="8" width="2" height="3" fill="#4f8495"/>
        <rect x="3" y="10" width="10" height="2" fill="#4f8495"/>
        <rect x="3" y="10" width="10" height="1" fill="#5c93a3"/>
        <rect x="4" y="12" width="3" height="4" fill="#3a6a7a"/>
        <rect x="9" y="12" width="3" height="4" fill="#3a6a7a"/>
        <rect x="6" y="12" width="1" height="4" fill="#274c58"/>
        <rect x="11" y="12" width="1" height="4" fill="#274c58"/>
      </svg>
      <svg class="bench" viewBox="0 0 22 7" width="176" height="56">
        <rect x="0" y="1" width="22" height="2" fill="#6b4a35"/>
        <rect x="0" y="1" width="22" height="1" fill="#80593f"/>
        <rect x="0" y="3" width="22" height="1" fill="#4a3024"/>
        <rect x="2" y="4" width="2" height="3" fill="#4a3024"/>
        <rect x="18" y="4" width="2" height="3" fill="#4a3024"/>
      </svg>
    </div>
  </div>

  <div class="affirmation-section">
    <button class="affirmation-btn" id="affirmation-btn" type="button">Toca aquí</button>
    <p class="affirmation-message" id="affirmation-message"></p>
  </div>

  <p class="closing-line">Un día a la vez.</p>
</main>

<script>
  // ---------------------------------------------------------------
  // Contador de días, zona horaria fija para que no se rompa si se
  // abre desde otro lado.
  // ---------------------------------------------------------------
  const START = new Date('2026-10-20T00:00:00-05:00');

  function updateDayCount(){
    const now = new Date();
    let diffMs = now - START;
    if(diffMs < 0) diffMs = 0;
    const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
    document.getElementById('day-number').textContent = days;
  }
  updateDayCount();
  setInterval(updateDayCount, 60 * 1000);

  // ---------------------------------------------------------------
  // Cielo: estrellas y nubes generadas con posiciones variadas
  // ---------------------------------------------------------------
  const scene = document.getElementById('sky-scene');

  for(let i = 0; i < 26; i++){
    const star = document.createElement('div');
    star.className = 'star';
    star.style.left = Math.random() * 100 + '%';
    star.style.top = (Math.random() * 45) + '%';
    star.style.opacity = (0.4 + Math.random() * 0.6).toFixed(2);
    scene.appendChild(star);
  }

  const cloudSpecs = [
    { top: '20%', left: '6%',  w: '30%', h: '7%',  dur: '14s' },
    { top: '30%', left: '58%', w: '26%', h: '6%',  dur: '18s' },
    { top: '42%', left: '2%',  w: '22%', h: '5%',  dur: '16s' },
  ];
  cloudSpecs.forEach(spec => {
    const cloud = document.createElement('div');
    cloud.className = 'cloud';
    cloud.style.top = spec.top;
    cloud.style.left = spec.left;
    cloud.style.width = spec.w;
    cloud.style.height = spec.h;
    cloud.style.animationDuration = spec.dur;
    scene.appendChild(cloud);
  });

  // ---------------------------------------------------------------
  // Casilla de mensajes de apoyo y autoestima
  // ---------------------------------------------------------------
  const mensajes = [
    "Estar solo un tiempo no significa que no merezcas compañía. Significa que te estás conociendo.",
    "No tienes que tenerlo todo resuelto hoy. Basta con que sigas aquí.",
    "Tu valor no lo decide quién se quedó o quién se fue.",
    "Está bien sentir el vacío. No tienes que llenarlo de inmediato.",
    "Eres la persona con la que vas a pasar el resto de tu vida. Empieza a tratarte así.",
    "La soledad de ahora no es permanente. Es solo un capítulo.",
    "Mereces el mismo cuidado que le darías a alguien que amas.",
    "Cada día que sigues aquí es prueba de que puedes con esto.",
    "No necesitas que nadie más te valide para saber que importas.",
    "Respira. No tienes que tener todas las respuestas ahora mismo.",
    "Lo que sientes es real, y también es temporal.",
    "Te estás reconstruyendo, y eso toma tiempo. No hay prisa.",
    "Eres suficiente, incluso en los días en que no lo sientes.",
    "Nadie más puede darte la paz que tú mismo puedes construirte.",
    "Hoy también cuenta. Hoy también eres valiente.",
    "El silencio de estar solo no es lo mismo que estar vacío.",
    "Mereces amor, empezando por el tuyo.",
    "Vas a estar bien. Quizás no hoy, pero vas a estar bien.",
  ];

  let lastIndex = -1;
  const btn = document.getElementById('affirmation-btn');
  const msgEl = document.getElementById('affirmation-message');

  btn.addEventListener('click', () => {
    let i = Math.floor(Math.random() * mensajes.length);
    if(mensajes.length > 1){
      while(i === lastIndex) i = Math.floor(Math.random() * mensajes.length);
    }
    lastIndex = i;
    msgEl.classList.remove('show');
    setTimeout(() => {
      msgEl.textContent = mensajes[i];
      msgEl.classList.add('show');
    }, 120);
    btn.textContent = 'Otro mensaje';
  });
</script>

</body>
</html>
